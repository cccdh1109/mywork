# 支持后续新增任务：把任务名追加到 jobs 列表，再增加对应 job.<name>.* 配置即可
jobs=order

# ===== 任务: order =====
job.order.enabled=true
job.order.cron=0 0/5 * * * ?
job.order.bucket=your-bucket
job.order.prefix=import/order/
job.order.index=order_index
job.order.delimiter=|
job.order.fields=order_id,user_id,amount,status,create_time
job.order.file-suffixes=.dat,.txt
job.order.skip-header=false
job.order.id-field=order_id
