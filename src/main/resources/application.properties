spring.application.name=oss-es-importer
server.port=8080

# ES 客户端配置（ES 7.10）
elasticsearch.host=127.0.0.1
elasticsearch.port=9200
elasticsearch.scheme=http

# OSS 客户端配置
aliyun.oss.endpoint=oss-cn-hangzhou.aliyuncs.com
aliyun.oss.access-key-id=please-set
aliyun.oss.access-key-secret=please-set

# 导入任务动态配置文件（可在运行时修改，无需重新打包）
app.import.config-file=./config/import-jobs.properties
# 自动扫描并刷新任务配置的间隔
app.import.reload-interval-seconds=30
# 导入状态落盘文件
app.import.state-file=./data/import-state.properties

management.endpoints.web.exposure.include=health,info
